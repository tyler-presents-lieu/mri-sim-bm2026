[project]
name = "mri-sim"
version = "0.1.0"
description = "An interactive MRI teaching simulator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.pdm]
distribution = false

[tool.pdm.scripts]
mri-sim = "uvicorn --app-dir src mri_sim.server:app --host 0.0.0.0 --port 8000 --reload"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]